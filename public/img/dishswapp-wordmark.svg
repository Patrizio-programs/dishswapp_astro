<?xml version="1.0" encoding="UTF-8"?>
<!-- DishSwapp — primary wordmark, on cream/light backgrounds
     Dish = ink #2C2A28, Swapp = deep teal #3D717C, italic
     Loaded by browsers that already have Playfair Display (Google Fonts).
     Minimum size: 24 px digital / 20 mm print. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 70" role="img" aria-label="DishSwapp">
  <text x="0" y="56"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="800"
        font-size="64"
        letter-spacing="-2"
        fill="#2C2A28">Dish</text>
  <text x="148" y="56"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="500"
        font-style="italic"
        font-size="64"
        letter-spacing="-1"
        fill="#3D717C">Swapp</text>
</svg>
