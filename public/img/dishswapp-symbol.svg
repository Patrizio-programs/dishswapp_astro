<?xml version="1.0" encoding="UTF-8"?>
<!-- DishSwapp — symbol mark (the swap loop)
     Two arcs in opposite rotation, meeting in the middle.
     Top-left arc = deep teal #3D717C (the "from" dish)
     Bottom-right arc = spice #E07A3B (the "to" / swapped dish)
     The intersecting line is the "exchange" stroke.

     Standalone use: favicon, app icon, the symbol-only lockup.
     Minimum size: 16 px (favicon), 24 px (UI). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DishSwapp symbol">
  <!-- Outer circle (the "plate") -->
  <circle cx="50" cy="50" r="48" fill="#3D717C"/>
  <!-- Top-left arc: peachy-pink -->
  <path d="M 18 50 A 32 32 0 0 1 82 50"
        fill="none"
        stroke="#F9B7A4"
        stroke-width="6"
        stroke-linecap="round"/>
  <!-- Bottom-right arc: spice -->
  <path d="M 82 50 A 32 32 0 0 1 18 50"
        fill="none"
        stroke="#E07A3B"
        stroke-width="6"
        stroke-linecap="round"/>
  <!-- Center exchange stroke -->
  <line x1="50" y1="18" x2="50" y2="82"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.85"/>
</svg>
